<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moran Family Board — read-only live preview</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --primary-color: #1296ed;
        --primary-text-color: #111827;
        --secondary-text-color: #526071;
        --secondary-background-color: #f6f8fb;
        --divider-color: #dfe5ec;
        --card-background-color: #ffffff;
        --ha-card-border-radius: 0;
        --error-color: #e84235;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      main,
      moran-family-board-card {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: white;
        color: var(--primary-text-color);
      }
      moran-family-board-card {
        display: block;
      }
      ha-icon {
        display: inline-flex;
        width: 18px;
        height: 18px;
      }
      #status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 100;
        padding: 8px 12px;
        border-radius: 8px;
        background: #16243a;
        color: white;
        font:
          12px system-ui,
          sans-serif;
        opacity: 0.84;
        pointer-events: none;
      }
      #status.error {
        background: #a82822;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <div id="status" role="status">Read-only local preview · loading calendars…</div>
    <script type="module">
      const status = document.querySelector("#status");
      try {
        await import(`/dist/moran-family-board-card.js?preview=${Date.now()}`);
        const response = await fetch("/api/preview-config", { cache: "no-store" });
        if (!response.ok) throw new Error("Preview configuration unavailable");
        const { calendars, people } = await response.json();
        const states = {};
        calendars.forEach((calendar) => {
          states[calendar] = {
            entity_id: calendar,
            state: "off",
            attributes: { friendly_name: calendar, supported_features: 0 },
          };
        });
        const colors = ["#8fa8f5", "#62cfbe", "#f58eae", "#e5b85c", "#98c785", "#c59cd3"];
        const persons = people.map((name, index) => {
          return {
            name,
            calendar: calendars,
            color: colors[index % colors.length],
            match_title_prefixes: [`${name}:`],
            strip_title_prefix: true,
          };
        });
        persons.push({ name: "Household", calendar: calendars, unmatched: true, color: "#ccb075" });
        const card = document.createElement("moran-family-board-card");
        card.setConfig({
          type: "custom:moran-family-board-card",
          layout: "wall",
          title: "Family Board",
          view: "day",
          views: ["day", "timeline", "week", "month", "agenda"],
          start_hour: 6,
          end_hour: 22,
          trim_hours: false,
          show_now_line: true,
          scroll_to_now: false,
          refresh_interval: 60,
          read_only: true,
          drag_drop: false,
          filter_duplicates: true,
          show_focus: true,
          persons,
        });
        card.hass = {
          states,
          locale: { language: "en-US", time_format: "12" },
          config: { unit_system: { temperature: "°F" } },
          callApi: async (method, path) => {
            if (method !== "GET" || !/^calendars\/calendar\.[a-z0-9_]+\?/.test(path)) {
              throw new Error("Read-only preview only supports calendar reads");
            }
            const events = await fetch(`/api/${path}`, { cache: "no-store" });
            if (!events.ok) throw new Error("Calendar source unavailable");
            return events.json();
          },
          callWS: async () => ({}),
        };
        document.querySelector("#app").append(card);
        const updateStatus = () => {
          if (card._loading) {
            status.textContent = "Read-only local preview · loading calendars…";
            return;
          }
          const good = card._calendarResults.filter((item) => item.status === "ok").length;
          status.classList.toggle("error", good !== calendars.length);
          status.textContent = `Read-only local preview · ${good}/${calendars.length} calendars loaded`;
        };
        setInterval(updateStatus, 500);
      } catch (error) {
        status.classList.add("error");
        status.textContent = `Live preview failed: ${error.message}`;
        throw error;
      }
    </script>
  </body>
</html>
